# The Origen — demo con Postgres.
# El frontend habla con la API por la red interna de Docker.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: origen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-origen}
      POSTGRES_DB: origen
    volumes:
      - origen_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U origen -d origen"]
      interval: 5s
      timeout: 4s
      retries: 12

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://origen:${POSTGRES_PASSWORD:-origen}@db:5432/origen
      # Demo local por HTTP. Para producción real: APP_ENV=production,
      # COOKIE_SECURE=true, FRONTEND_ORIGIN=https://… y secretos propios.
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-dev-data-key-0123456789abcdef!!!}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,api,web,testserver}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: "false"
      APP_ENV: development
      SEED_DEMO: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        API_INTERNAL_URL: http://api:8000
    restart: unless-stopped
    environment:
      # Runtime: lo usa el SSR al pedir la carta. El rewrite se fija en el build.
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  origen_pgdata:
